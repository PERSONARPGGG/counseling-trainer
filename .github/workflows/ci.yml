name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: |
          echo "=== Checking JS syntax ==="
          for f in $(find . -name '*.js' -not -path './node_modules/*' -not -path './.git/*' -not -name 'unit_test.js'); do
            node --check "$f" 2>&1 || exit 1
          done
          echo "=== All checks passed ==="
